<!doctype html>
<meta charset="utf-8">
<title>Yapatar — live preview</title>
<style>
  :root {
    color-scheme: dark;
    --black:   #0A0B0A;         /* modem.dev warm black */
    --teal:    #44BDA3;
    --cream:   #F8F8ED;
    --panel:   #111312;
    --raised:  #171A19;
    --line:    #232725;
    --text:    #E8E9E4;
    --dim:     #8A928C;
    --radius:  10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    background: var(--black); color: var(--text);
    font: 13px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif;
    display: grid; grid-template-columns: 1fr 348px;
  }

  /* ---------- stage ---------- */
  #stage { position: relative; display: grid; place-items: center; min-width: 0; }
  #surface {
    display: grid; place-items: center; border-radius: 14px;
    /* fixed so the backdrop stays constant when you switch preview sizes -
       otherwise the thing you are judging the overlay against shrinks with it */
    width: 568px; height: 568px;
    transition: background .2s;
  }
  #surface.checker {
    background:
      repeating-conic-gradient(#1a1d1b 0 25%, #101211 0 50%) 0 0 / 28px 28px;
  }
  #surface.dark  { background: #0A0B0A; }
  #surface.light { background: #E9E6DD; }
  #surface.photo {
    background: radial-gradient(120% 120% at 30% 20%, #C8B49B 0%, #7C8AA0 55%, #2C3440 100%);
  }
  canvas { width: 512px; height: 512px; display: block; transition: width .2s, height .2s; }

  .stagebar {
    position: absolute; top: 20px; left: 20px; display: flex; gap: 16px; align-items: center;
  }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .seg button {
    all: unset; padding: 5px 11px; border-radius: 6px; font-size: 11.5px; color: var(--dim);
    cursor: pointer; letter-spacing: .02em;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--cream); box-shadow: inset 0 0 0 1px var(--line); }
  .segLabel { font-size: 10.5px; text-transform: uppercase; letter-spacing: .10em; color: #5F665F; }

  /* ---------- sidebar ---------- */
  aside {
    background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; overflow-x: hidden; padding: 22px 20px 40px;
  }
  aside::-webkit-scrollbar { width: 10px; }
  aside::-webkit-scrollbar-thumb { background: #222624; border-radius: 6px; border: 3px solid var(--panel); }

  .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 18px; }
  .brand b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; color: var(--cream); }
  .brand span { font-size: 11px; color: var(--dim); }

  h2 {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .11em;
    color: #5F665F; font-weight: 600; margin: 24px 0 10px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  h2:first-of-type { margin-top: 0; }

  label { display: flex; justify-content: space-between; align-items: baseline;
          margin: 12px 0 5px; font-size: 12px; color: var(--dim); }
  label b { font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums;
            font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }

  /* status pill */
  #status { display: flex; align-items: center; gap: 8px; font-size: 12px;
            padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line); }
  #status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; flex: none; }
  #status.idle { background: #17130F; color: #C99A6E; border-color: #2E2418; }
  #status.idle::before { background: #C99A6E; }
  #status.live { background: #0F1A15; color: var(--teal); border-color: #1D3A30; }
  #status.live::before { background: var(--teal); box-shadow: 0 0 0 3px rgba(68,189,163,.18); }

  #meter { height: 4px; background: #1B1F1D; border-radius: 2px; overflow: hidden; margin: 8px 0 14px; }
  #meter i { display: block; height: 100%; width: 0%;
             background: linear-gradient(90deg, var(--teal), #7FD9C4); transition: width .05s; }

  /* controls */
  button, select {
    width: 100%; font: inherit; color: var(--text); background: var(--raised);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 12px;
    cursor: pointer; transition: background .15s, border-color .15s;
  }
  button:hover:not(:disabled), select:hover { background: #1E2220; border-color: #2E3330; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%),
                      linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
    padding-right: 32px;
  }
  #render {
    background: var(--teal); border-color: var(--teal); color: #06231C;
    font-weight: 600; margin-top: 4px;
  }
  #render:hover:not(:disabled) { background: #55CFB4; border-color: #55CFB4; }

  input[type=file] {
    width: 100%; font: inherit; color: var(--dim); background: var(--raised);
    border: 1px dashed #2E3330; border-radius: var(--radius); padding: 8px 10px; cursor: pointer;
  }
  input[type=file]:hover { border-color: var(--teal); color: var(--text); }
  input[type=file]::file-selector-button {
    font: inherit; margin-right: 10px; padding: 4px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer;
  }

  input[type=range] { appearance: none; width: 100%; height: 18px; background: none; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px; background: #262B28;
  }
  input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 14px; height: 14px; margin-top: -5.5px;
    border-radius: 50%; background: var(--cream); border: none;
    box-shadow: 0 1px 4px rgba(0,0,0,.5); transition: transform .12s;
  }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.15); }
  input[type=range]:active::-webkit-slider-thumb { background: var(--teal); }

  hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0 0; }
  .hint { color: #6B726C; font-size: 11.5px; margin-top: 8px; }
  .hint a { color: var(--teal); }
  #avatarNote { margin-top: 7px; }
  #avatarNote a { color: var(--dim); text-decoration: underline; }
  #rprog { height: 4px; background: #1B1F1D; border-radius: 2px; overflow: hidden; margin: 10px 0 0; display: none; }
  #rprog i { display: block; height: 100%; width: 0%; background: var(--teal); transition: width .3s; }
</style>

<div id="stage">
  <div class="stagebar">
    <span class="segLabel">Behind</span>
    <div class="seg" id="bgseg">
      <button data-bg="checker" aria-pressed="true">alpha</button>
      <button data-bg="dark">dark</button>
      <button data-bg="light">light</button>
      <button data-bg="photo">footage</button>
    </div>
    <span class="segLabel">Size</span>
    <div class="seg" id="sizeseg">
      <button data-size="512" aria-pressed="true">full</button>
      <button data-size="256">half</button>
      <button data-size="140">corner</button>
    </div>
  </div>
  <div id="surface" class="checker"><canvas id="c" width="512" height="512"></canvas></div>
</div>

<aside>
  <div class="brand"><b>Yapatar</b> <span>live preview</span></div>

  <div id="status" class="idle">idle — press play or enable the mic</div>
  <div id="meter"><i></i></div>
  <div class="row">
    <button id="play">▶ Test audio</button>
    <button id="mic">🎙 Microphone</button>
  </div>

  <h2>Source</h2>
  <label>Avatar image</label>
  <input type="file" id="avatarFile" accept="image/*">
  <div id="avatarNote" class="hint"></div>
  <label>Audio file</label>
  <input type="file" id="audioFile" accept="audio/*,video/*">

  <h2>Look</h2>
  <label>Style</label>
  <select id="style">
    <option value="pulse">pulse — glow, rings, waveform</option>
    <option value="constellation">constellation — QAM lattice</option>
    <option value="waterfall">waterfall — radial spectrogram</option>
    <option value="packets">packets — framed data bursts</option>
    <option value="handshake">handshake — carrier + symbols</option>
  </select>
  <label>Palette</label>
  <select id="preset">
    <option value="">default — hue sliders</option>
    <option value="modem">modem.dev — teal + cream</option>
  </select>
  <label>Hue A <b id="hueAv"></b></label><input type="range" id="hueA" min="0" max="360" value="190">
  <label>Hue B <b id="hueBv"></b></label><input type="range" id="hueB" min="0" max="360" value="285">

  <h2>Motion</h2>
  <label>Bounce <b id="bouncev"></b></label><input type="range" id="bounce" min="0" max="30" value="9">
  <label>Glow <b id="glowv"></b></label><input type="range" id="glow" min="0" max="200" value="100">
  <label>Blob amount <b id="blobv"></b></label><input type="range" id="blob" min="0" max="30" value="9">
  <label>Sensitivity <b id="rangev"></b></label><input type="range" id="range" min="6" max="30" value="13">

  <h2>Export</h2>
  <label>Codec</label>
  <select id="codec">
    <option value="hevc">hevc — small (~1.3 GB / 30 min)</option>
    <option value="prores">prores 4444 — huge (~27 GB / 30 min)</option>
    <option value="png">png — lossless RGBA</option>
  </select>
  <button id="render">🎬 Render the final file</button>
  <div id="rprog"><i></i></div>
  <div id="rstatus" class="hint"></div>

  <hr>
  <button id="save" style="margin-top:16px">💾 Save settings for the agent</button>
  <div id="saved" class="hint"></div>
</aside>

<script type="module">
import { createVisualizer } from './src/visual.js';

const KEYS = ['hueA','hueB','bounce','glow','blob','range'];
const CHOICES = ['style','preset'];

function applySettings(obj) {
  for (const k of [...KEYS, ...CHOICES])
    if (obj[k] != null && document.getElementById(k)) document.getElementById(k).value = obj[k];
}
{
  const qs = new URLSearchParams(location.search);
  if ([...qs.keys()].some(k => KEYS.includes(k) || CHOICES.includes(k))) {
    applySettings(Object.fromEntries(qs));         // agent-supplied wins
  } else {
    fetch('/settings').then(r => r.ok ? r.json() : {}).then(applySettings).catch(() => {});
  }
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let viz = createVisualizer({ size: 512 });
let vizKey = '';
const $ = id => document.getElementById(id);

let avatar = new Image();
avatar.src = 'assets/avatar.png';
let avatarName = 'assets/avatar.png', audioName = 'assets/voice.wav';

// --- remember the avatar across reloads -------------------------------------
// Stored as a downscaled data URL: localStorage holds strings and is capped
// around 5 MB, so a full-size photo would blow the quota. 512px is already the
// most the visual can use, since the avatar is drawn circle-cropped at that size.
const AVATAR_KEY = 'yapatar.avatar';
let rememberedAvatar = null;   // { url, name }

function loadRemembered() {
  try {
    const raw = localStorage.getItem(AVATAR_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    return o && o.url ? o : null;
  } catch { return null; }        // private windows and blocked storage throw
}

function rememberAvatar(img, name) {
  try {
    const S = 512;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const x = c.getContext('2d');
    // cover-crop to a square so a wide photo isn't squashed
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    x.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2,
                side, side, 0, 0, S, S);
    let url = c.toDataURL('image/png');
    if (url.length > 2_000_000) url = c.toDataURL('image/jpeg', 0.85);   // photos: drop alpha, stay small
    localStorage.setItem(AVATAR_KEY, JSON.stringify({ url, name }));
    rememberedAvatar = { url, name };
    showAvatarNote();
  } catch (e) {
    $('avatarNote').textContent = 'could not remember this image (storage full or blocked)';
  }
}

function showAvatarNote() {
  const el = $('avatarNote');
  if (!rememberedAvatar) { el.textContent = ''; return; }
  el.innerHTML = `remembered: ${rememberedAvatar.name} — <a href="#" id="forget">forget</a>`;
  $('forget').onclick = (ev) => {
    ev.preventDefault();
    try { localStorage.removeItem(AVATAR_KEY); } catch {}
    rememberedAvatar = null;
    avatarName = 'assets/avatar.png';
    avatar.src = 'assets/avatar.png';
    showAvatarNote();
  };
}

$('avatarFile').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  avatarName = f.name;
  const url = URL.createObjectURL(f);
  const probe = new Image();
  probe.onload = () => { rememberAvatar(probe, f.name); URL.revokeObjectURL(url); };
  probe.src = url;
  avatar.src = url;
};

{
  const r = loadRemembered();
  if (r) { rememberedAvatar = r; avatar.src = r.url; avatarName = r.name; }
  showAvatarNote();
}

const AC = new (window.AudioContext || window.webkitAudioContext)();
const analyser = AC.createAnalyser();
analyser.fftSize = 2048;
analyser.smoothingTimeConstant = 0;
const freq = new Float32Array(analyser.frequencyBinCount);
const time = new Float32Array(analyser.fftSize);
let source = null, audioUrl = 'assets/voice.wav', playing = null;

$('audioFile').onchange = e => {
  const f = e.target.files[0];
  if (f) { audioUrl = URL.createObjectURL(f); audioName = f.name; }
};

$('play').onclick = async () => {
  await AC.resume();
  if (source) { try { source.stop?.(); source.disconnect(); } catch {} }
  const el = new Audio(audioUrl); el.crossOrigin = 'anonymous';
  playing = el;
  source = AC.createMediaElementSource(el);
  source.connect(analyser); analyser.connect(AC.destination);
  el.onended = () => setMode('idle', 'idle — press play or enable the mic');
  await el.play();
  setMode('file', '▶ playing — you should see it pulse');
};
$('mic').onclick = async () => {
  await AC.resume();
  const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
  if (source) { try { source.disconnect(); } catch {} }
  source = AC.createMediaStreamSource(s);
  source.connect(analyser);   // not connected to destination: no feedback loop
  playing = null;
  setMode('mic', '🎙 mic live — talk and watch it react');
};

// --- browser-side feature extraction, mirroring src/audio.js -----------------
const SPEC_BINS = 64;
const spectrum = new Float32Array(SPEC_BINS);
let lvl = 0, env = 0, ceilDb = -20, floorDb = -45, i = 0;

function features() {
  analyser.getFloatFrequencyData(freq);
  analyser.getFloatTimeDomainData(time);

  let sum = 0; for (let k = 0; k < time.length; k++) sum += time[k] * time[k];
  const db = 20 * Math.log10(Math.sqrt(sum / time.length) + 1e-9);

  // adaptive calibration: track a decaying loud-ceiling for this session
  ceilDb = db > ceilDb ? db : ceilDb * 0.9995 + db * 0.0005;
  const range = +$('range').value;
  floorDb = ceilDb - range;

  let v = Math.max(0, Math.min(1, (db - floorDb) / range));
  v = v < 0.04 ? 0 : (v - 0.04) / 0.96;
  const target = Math.pow(v, 0.85);
  const prev = lvl;
  lvl += (target - lvl) * (target > lvl ? 0.55 : 0.10);
  env = Math.max(env * 0.86, Math.max(0, lvl - prev) * 6);

  const nyq = AC.sampleRate / 2, binHz = nyq / analyser.frequencyBinCount;
  for (let b = 0; b < SPEC_BINS; b++) {
    const f0 = 60 * Math.pow(8000 / 60, b / SPEC_BINS), f1 = 60 * Math.pow(8000 / 60, (b + 1) / SPEC_BINS);
    const i0 = Math.max(1, Math.floor(f0 / binHz)), i1 = Math.max(i0 + 1, Math.floor(f1 / binHz));
    let m = -140; for (let k = i0; k < i1 && k < freq.length; k++) m = Math.max(m, freq[k]);
    const s = Math.max(0, Math.min(1, (m + 70) / 60));
    spectrum[b] = s > spectrum[b] ? s : spectrum[b] * 0.78 + s * 0.22;
  }
  const avg = (a, b) => { let s = 0; for (let k = a; k < b; k++) s += spectrum[k]; return s / (b - a); };
  const wave = new Float32Array(180);
  for (let k = 0; k < 180; k++) wave[k] = time[Math.floor(k / 180 * time.length)];

  return { i: i++, fps: 60, level: lvl, attack: Math.min(1, env),
           bands: [avg(0,16), avg(16,40), avg(40,SPEC_BINS)], spectrum, waveform: wave };
}

const statusEl = $('status'), meterEl = document.querySelector('#meter i');
let mode = 'idle';
function setMode(m, text) { mode = m; statusEl.textContent = text; statusEl.className = m === 'idle' ? 'idle' : 'live'; }

function tick() {
  const key = `${$('style').value}|${$('preset').value}`;
  if (key !== vizKey) {
    vizKey = key;
    viz = createVisualizer({ size: 512, style: $('style').value, preset: $('preset').value || undefined });
  }
  viz.cfg.hueA = +$('hueA').value; $('hueAv').textContent = viz.cfg.hueA;
  viz.cfg.hueB = +$('hueB').value; $('hueBv').textContent = viz.cfg.hueB;
  viz.cfg.bounce = +$('bounce').value / 100; $('bouncev').textContent = viz.cfg.bounce.toFixed(2);
  viz.cfg.glow = +$('glow').value / 100; $('glowv').textContent = viz.cfg.glow.toFixed(2);
  viz.cfg.blobAmount = +$('blob').value / 100; $('blobv').textContent = viz.cfg.blobAmount.toFixed(2);
  $('rangev').textContent = $('range').value + ' dB';
  const f = features();
  meterEl.style.width = (f.level * 100).toFixed(1) + '%';
  if (mode === 'file' && f.level < 0.01 && playing && playing.ended) setMode('idle', 'idle — press play or enable the mic');
  viz.draw(ctx, f, avatar.complete ? avatar : null);
  requestAnimationFrame(tick);
}
$('save').onclick = async () => {
  const body = Object.fromEntries(KEYS.map(k => [k, +$(k).value]));
  for (const k of CHOICES) if ($(k).value) body[k] = $(k).value;
  body.audio = audioName; body.avatar = avatarName;
  try {
    const r = await fetch('/settings', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
    });
    const j = await r.json();
    $('saved').textContent = j.ok ? 'saved -> settings.json' : `save failed: ${j.error}`;
  } catch {
    $('saved').textContent = 'save failed - are you running `node src/serve.js`?';
  }
};

// --- render on the server ---------------------------------------------------
// The browser cannot hand Node a file path, but it can hand it the bytes.
async function blobFor(input, fallbackUrl) {
  const f = input.files && input.files[0];
  if (f) return [f, f.name];
  const r = await fetch(fallbackUrl);
  return [await r.blob(), fallbackUrl.split('/').pop()];
}

async function upload(blob, name) {
  const r = await fetch(`/upload?name=${encodeURIComponent(name)}`, { method: 'POST', body: blob });
  if (!r.ok) throw new Error((await r.json()).error || 'upload failed');
  return (await r.json()).id;
}

$('render').onclick = async () => {
  const btn = $('render'), st = $('rstatus');
  btn.disabled = true; $('rprog').style.display = 'block'; st.textContent = 'uploading…';
  try {
    const [aBlob, aName] = await blobFor($('audioFile'), '/assets/voice.wav');
    const [vBlob, vName] = $('avatarFile').files[0]
      ? await blobFor($('avatarFile'), '/assets/avatar.png')
      : rememberedAvatar
        ? [await (await fetch(rememberedAvatar.url)).blob(), rememberedAvatar.name]
        : await blobFor($('avatarFile'), '/assets/avatar.png');
    const [audioId, avatarId] = await Promise.all([upload(aBlob, aName), upload(vBlob, vName)]);

    const body = { audioId, avatarId, codec: $('codec').value, style: $('style').value };
    if ($('preset').value) body.preset = $('preset').value;
    else { body.hueA = +$('hueA').value; body.hueB = +$('hueB').value; }
    for (const k of ['bounce','glow','blob','range']) body[k] = +$(k).value;

    const r = await fetch('/render', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
    });
    const { jobId, error } = await r.json();
    if (!jobId) throw new Error(error || 'could not start render');

    st.textContent = 'rendering…';
    const poll = setInterval(async () => {
      const j = await (await fetch(`/job/${jobId}`)).json();
      $('rprog').querySelector('i').style.width = j.pct + '%';
      if (j.state === 'done') {
        clearInterval(poll); btn.disabled = false;
        st.innerHTML = `done — <a href="${j.output}" download>download avatar_alpha.mov</a>`;
      } else if (j.state === 'error') {
        clearInterval(poll); btn.disabled = false;
        st.textContent = `failed: ${j.error}`;
      } else {
        st.textContent = `rendering… ${j.pct}%`;
      }
    }, 500);
  } catch (e) {
    btn.disabled = false;
    st.textContent = `failed: ${e.message}`;
  }
};

tick();
// --- stage controls ---------------------------------------------------------
// Judging an overlay means seeing it over what it will actually sit on, and at
// the size it will actually appear - a corner avatar is far smaller than 512px.
function segment(id, apply) {
  const seg = document.getElementById(id);
  seg.onclick = (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    for (const b of seg.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b === btn));
    apply(btn.dataset);
    try { localStorage.setItem('yapatar.' + id, btn.dataset.bg || btn.dataset.size); } catch {}
  };
  try {
    const saved = localStorage.getItem('yapatar.' + id);
    if (saved) {
      const btn = seg.querySelector(`[data-bg="${saved}"], [data-size="${saved}"]`);
      if (btn) btn.click();
    }
  } catch {}
}
segment('bgseg',   (d) => { $('surface').className = d.bg; });
segment('sizeseg', (d) => { const cv = $('c'); cv.style.width = cv.style.height = d.size + 'px'; });

</script>
